<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sleep Outside | Home</title>
    <link rel="stylesheet" href="/css/style.css" />
  </head>

  <body>
    <header id="main-header" class="divider"></header>

    <main class="divider">
      <div class="hero">
        <div class="logo logo--square">
          <img src="/images/noun_Tent_2517.svg" alt="tent image for logo" />
          <div>Sleep<span class="highlight">Outside</span></div>
        </div>
        <img src="/images/banner-sm.jpg" srcset="/images/banner-sm.jpg 500w, /images/banner.jpg" alt="image of a high mountain lake" />
        <div class="mission">
          <p>Sleep Outside provides outdoor gear for families that love camping, hiking, climbing, and exploring.</p>
        </div>
      </div>

      <section class="categories">
        <h2>Shop by Category</h2>
        <ul class="category-list">
          <li>
            <a href="/product_listing/index.html?category=tents">
              <img src="/images/category-tents.svg" alt="Tents category icon" />
              <span>Tents</span>
            </a>
          </li>
          <li>
            <a href="/product_listing/index.html?category=backpacks">
              <img src="/images/category-backpacks.svg" alt="Backpacks category icon" />
              <span>Backpacks</span>
            </a>
          </li>
          <li>
            <a href="/product_listing/index.html?category=sleeping-bags">
              <img src="/images/category-sleepingbags.svg" alt="Sleeping bags category icon" />
              <span>Sleeping Bags</span>
            </a>
          </li>
          <li>
            <a href="/product_listing/index.html?category=hammocks">
              <img src="/images/category-hammocks.svg" alt="Hammocks category icon" />
              <span>Hammocks</span>
            </a>
          </li>
        </ul>
      </section>
    </main>

    <footer id="main-footer"></footer>

    <script type="module" src="./js/main.js"></script>
  </body>
</html>
